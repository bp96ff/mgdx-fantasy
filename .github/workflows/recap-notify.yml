# When a new weekly recap is published (data/recaps.json changes on main), waits for it to be live on the site,
# then asks the push function to send "Week N recap is up". The function only sends once per week, so fixes to
# an older recap send nothing.
name: Recap notification

on:
  push:
    branches: [main]
    paths: [data/recaps.json]
  workflow_dispatch: # lets you run it by hand from the Actions tab

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Wait for the recap to be live
        run: |
          want=$(node -e "const w=require('./data/recaps.json').weeks;console.log(Math.max(...w.map(x=>x.week)))")
          for i in $(seq 1 40); do
            live=$(curl -s "https://mgdxfantasy.com/data/recaps.json?t=$(date +%s)" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(Math.max(...JSON.parse(s).weeks.map(x=>x.week)))}catch{console.log(0)}})")
            echo "Week $want in the repo, week $live live"
            [ "$live" -ge "$want" ] && exit 0
            sleep 30
          done
          echo "The recap still isn't live after 20 minutes." && exit 1
      - name: Send the notification
        run: curl -sS --max-time 60 -X POST "https://blfbdmrnrwvylvqakgck.supabase.co/functions/v1/push" -H "Content-Type: application/json" -H "apikey: sb_publishable_YgYOVZ69vU8LUPqhHvN7YQ_RJdv64e_" -d '{"action":"recap"}'
