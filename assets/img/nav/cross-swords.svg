<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Crossed swords">
  <defs>
    <linearGradient id="leagues" gradientUnits="userSpaceOnUse" x1="8" y1="8" x2="56" y2="56">
      <stop offset="0" stop-color="#3f8cf0"/>
      <stop offset=".36" stop-color="#66b85a"/>
      <stop offset=".66" stop-color="#f6bd2f"/>
      <stop offset="1" stop-color="#ec6a4f"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="#06121f"/>
  <circle cx="32" cy="32" r="28" fill="none" stroke="url(#leagues)" stroke-width="3"/>
  <g transform="translate(32 30) scale(.8) translate(-32 -32)">
  <!-- Sword running from the top right down to the bottom left -->
  <g fill="url(#leagues)" stroke="url(#leagues)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M47 14l-1.2 7.2-20.4 20.4-5-5L40.800 16.200z" stroke-width="1"/>
    <path d="M15 34l15 15" fill="none" stroke-width="4"/>
    <path d="M21.500 42.500L15.500 48.500" fill="none" stroke-width="4"/>
    <circle cx="13.500" cy="50.500" r="3.200" stroke="none"/>
  </g>
  <!-- Dark edge so the top sword reads as crossing over -->
  <path d="M17 14l7 2.200 23.300 23.300-7.800 7.800L17.700 21.200z" fill="#06121f" stroke="#06121f" stroke-width="3" stroke-linejoin="round"/>
  <!-- Sword running from the top left down to the bottom right -->
  <g fill="url(#leagues)" stroke="url(#leagues)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17 14l6.200 2.200 20.400 20.400-5 5L18.200 21.200z" stroke-width="1"/>
    <path d="M49 34L34 49" fill="none" stroke-width="4"/>
    <path d="M42.500 42.500l6 6" fill="none" stroke-width="4"/>
    <circle cx="50.500" cy="50.500" r="3.200" stroke="none"/>
  </g>
  </g>
</svg>
